<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧廁所管理儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        
        /* 卡片佈局 */
        #dashboard-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        /* 代表「一間廁所」的卡片 */
        .stall-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
            width: 280px;
            overflow: hidden; /* 確保狀態列貼齊頂部 */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stall-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* 卡片頂部的「狀態列」 */
        .stall-status {
            padding: 16px 20px;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            transition: background-color 0.3s ease;
        }

        /* === 核心狀態顏色 === */
        /* 閒置 (綠色) */
        .stall-card.idle .stall-status {
            background-color: #28a745; /* 綠色 */
        }
        /* 使用中 (藍色) */
        .stall-card.in-use .stall-status {
            background-color: #007bff; /* 藍色 */
        }
        /* 節能模式 (黃色) */
        .stall-card.eco-mode .stall-status {
            background-color: #fdc107; /* 黃色 */
            color: #333;
        }
        /* 錯誤 (紅色) */
        .stall-card.error .stall-status {
            background-color: #dc3545; /* 紅色 */
        }

        /* 卡片內部的「感測器數據」 */
        .stall-content {
            padding: 20px;
        }
        .stall-content h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-align: center;
            color: #333;
        }
        .sensor-data {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sensor-data li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .sensor-data li:last-child {
            border-bottom: none;
        }
        .sensor-data li strong {
            color: #555;
        }
        .sensor-data li span {
            font-weight: 600;
            font-size: 1.1rem;
            color: #333;
            background-color: #f4f7f6;
            padding: 4px 10px;
            border-radius: 5px;
        }

        /* 空氣品質狀態 */
        .sensor-data li span.good { color: #28a745; }
        .sensor-data li span.moderate { color: #fdc107; }
        .sensor-data li span.bad { color: #dc3545; }
        
        /* 2. 新增：彈出視窗 (Modal) 的樣式 */
        .modal {
            display: none; /* 預設隱藏 */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* 半透明黑色背景 */
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        .close-btn:hover { color: black; }
        
        /* 統計數據的小方塊 */
        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .stat-box {
            text-align: center;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            width: 45%;
        }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #007bff; }
        .stat-label { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

    <h2>智慧廁所管理儀表板</h2>
    
    <div id="dashboard-container"></div>
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">隔間數據分析</h2>
            
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-val" id="stat-count">計算中...</div>
                    <div class="stat-label">今日使用次數</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-avg-time">計算中...</div>
                    <div class="stat-label">平均使用時間 (分)</div>
                </div>
            </div>

            <canvas id="usageChart"></canvas>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
