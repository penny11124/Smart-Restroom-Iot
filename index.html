<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧廁所管理儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        
        /* 標題與按鈕 */
        .header-container {
            position: relative; display: flex; justify-content: center; align-items: center;
            width: 100%; max-width: 1200px; margin: 0 auto 20px auto; padding: 10px 20px; box-sizing: border-box;
        }
        h2 { margin: 0; color: #333; font-size: 1.8rem; }
        .esg-btn {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            background-color: #28a745; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .esg-btn:hover { background-color: #218838; }

        /* 卡片 */
        #dashboard-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; }
        .stall-card {
            background-color: #ffffff; border-radius: 12px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
            width: 280px; overflow: hidden; transition: transform 0.2s ease; cursor: pointer;
        }
        .stall-card:hover { transform: translateY(-5px); }
        .stall-status { padding: 16px; font-size: 1.4rem; font-weight: 700; text-align: center; color: #fff; }
        .stall-card.idle .stall-status { background-color: #28a745; }
        .stall-card.in-use .stall-status { background-color: #007bff; }
        .stall-card.eco-mode .stall-status { background-color: #fdc107; color: #333; }
        .stall-card.error .stall-status { background-color: #dc3545; }
        .stall-content { padding: 20px; }
        .stall-content h3 { margin: 0 0 15px 0; font-size: 1.5rem; text-align: center; color: #333; }
        
        .sensor-data { list-style: none; padding: 0; margin: 0; }
        .sensor-data li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .sensor-data li:last-child { border-bottom: none; }
        .sensor-data li span { font-weight: 600; color: #333; background: #f4f7f6; padding: 4px 10px; border-radius: 5px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background-color: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 900px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #aaa; }
        
        .stats-row { display: flex; justify-content: space-around; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .stat-box { text-align: center; background: #f8f9fa; padding: 15px; border-radius: 10px; flex: 1; min-width: 120px; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #007bff; }
        .stat-label { font-size: 0.9rem; color: #666; margin-top: 5px; }
        
        .stat-box.esg { background: #e8f5e9; border: 1px solid #c3e6cb; }
        .stat-box.esg .stat-val { color: #28a745; }
        
        .stat-box.cleaning { background: #fff3cd; border: 1px solid #ffeeba; }
        .stat-box.cleaning .stat-val { color: #856404; }

        .progress-container { width: 100%; background-color: #e9ecef; border-radius: 5px; margin-top: 5px; height: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: #28a745; width: 0%; transition: width 0.5s, background-color 0.5s; }

        /* AI 洞察區塊 */
        .ai-insight-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .ai-icon { font-size: 2rem; }
        .ai-text h4 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .ai-text p { margin: 0; font-size: 0.95rem; opacity: 0.9; }

        .chart-container-box { position: relative; height: 400px; width: 100%; margin-top: 20px; }
    
        /* 清潔重置按鈕 */
        .reset-btn {
            background-color: #fff; border: 1px solid #ced4da; color: #495057;
            padding: 5px 10px; font-size: 0.8rem; border-radius: 5px;
            cursor: pointer; margin-top: 8px; transition: all 0.2s;
        }
        .reset-btn:hover { background-color: #e2e6ea; border-color: #adb5bd; }
        .reset-btn:active { background-color: #dae0e5; }
    
    </style>
</head>
<body>

    <div class="header-container">
        <h2>智慧廁所管理儀表板</h2>
        <button class="esg-btn" onclick="openEnergyReport()">🌱 節能成效報表</button>
    </div>
    
    <div id="dashboard-container"></div>

    <!-- 1. 隔間分析與智慧清潔 Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('detail-modal')">&times;</span>
            <h2 id="modal-title">隔間數據分析</h2>
            
            <div class="ai-insight-box">
                <div class="ai-icon">🤖</div>
                <div class="ai-text">
                    <h4>AI 預測建議</h4>
                    <p id="ai-suggestion-text">分析歷史數據中...</p>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-val" id="stat-count">-</div>
                    <div class="stat-label">今日使用人次</div>
                </div>
                <div class="stat-box cleaning">
                    <div class="stat-val" id="stat-clean-status">良好</div>
                    <div class="stat-label">清潔狀態</div>
                    <div class="progress-container">
                        <div id="clean-progress-bar" class="progress-bar"></div>
                    </div>
                    <div style="font-size: 0.8rem; color: #666; margin-top: 3px;">
                        自上次清潔後: <span id="clean-count">0</span> 人
                    </div>
                    <button class="reset-btn" onclick="resetCleaningStatus()">
                        🧹 完成清潔
                    </button>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-peak-hour">分析中</div>
                    <div class="stat-label">今日尖峰時段</div>
                </div>
            </div>

            <div class="chart-container-box">
                <canvas id="usageChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 2. ESG 報表 Modal -->
    <div id="energy-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('energy-modal')">&times;</span>
            <h2 style="color: #28a745;">🌱 ESG節能成效報告</h2>
            <p style="text-align:center; color:#666;">比較基準：傳統廁所24H全開 vs. 本系統</p>
            
            <div class="stats-row">
                <div class="stat-box esg">
                    <div class="stat-val" id="esg-kwh">-</div>
                    <div class="stat-label">節省電力 <span class="stat-unit">(Wh)</span></div>
                </div>
                <div class="stat-box esg">
                    <div class="stat-val" id="esg-carbon">-</div>
                    <div class="stat-label">減少碳排 <span class="stat-unit">(gCO2e)</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="esg-rate">-</div>
                    <div class="stat-label">節能率 (%)</div>
                </div>
            </div>
            <div class="chart-container-box">
                <canvas id="energyChart"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
